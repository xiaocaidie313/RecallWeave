server:
  port: 8008

database:
  host: localhost
  port: 5434
  user_name: postgres
  password: "your-password"
  db_name: Recall_Vector

llm:
  base_url: https://api.siliconflow.cn/v1
  api_key: ""
  model: deepseek-ai/DeepSeek-V4-Flash
  embedding_model: Qwen/Qwen3-VL-Embedding-8B
  timeout_seconds: 30

# 仓库内技能目录；也可用环境变量 RECALLWEAVE_SKILLS_DIR 覆盖。
skills:
  dir: skills

# 可选：让 Agent 使用外部 Streamable HTTP MCP 工具。只暴露 tools 白名单中的工具。
# token_env 填环境变量名，不要把实际 token 写进配置文件。
# external_mcp:
#   url: https://example.com/mcp
#   token_env: RECALLWEAVE_EXTERNAL_MCP_TOKEN
#   tools:
#     - search

# 可选替代：Tavily 远程搜索与正文提取（与上面的 external_mcp 二选一）。
# 先在启动服务的进程环境设置 TAVILY_API_KEY；实际密钥不要放进 URL 或 YAML。
external_mcp:
  url: https://mcp.tavily.com/mcp/
  token_env: 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
  tools:
    - tavily_search
    - tavily_extract
