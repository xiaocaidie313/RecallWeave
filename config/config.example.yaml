server:
  port: 8008

database:
  host: localhost
  port: 5434
  user_name: postgres
  password: "your-password"
  db_name: Recall_Vector

llm:
  base_url: https://api.siliconflow.cn/v1
  api_key: ""
  model: deepseek-ai/DeepSeek-V4-Flash
  embedding_model: Qwen/Qwen3-VL-Embedding-8B
  timeout_seconds: 30

# 仓库内技能目录；也可用环境变量 RECALLWEAVE_SKILLS_DIR 覆盖。
skills:
  dir: skills

# 可选：让 Agent 使用外部 Streamable HTTP MCP 工具。只暴露 tools 白名单中的工具。
# token_env 填环境变量名，不要把实际 token 写进配置文件。
# external_mcp:
#   url: https://example.com/mcp
#   token_env: RECALLWEAVE_EXTERNAL_MCP_TOKEN
#   tools:
#     - search
