server:
  # Local API has no user/account authentication. Bind explicitly for remote access.
  host: 127.0.0.1
  port: 8008

database:
  host: localhost
  port: 5434
  user_name: postgres
  password: recallweave-local
  db_name: recallweave

llm:
  # OpenAI-compatible endpoint. Set RECALLWEAVE_LLM_API_KEY in the process environment.
  base_url: https://api.siliconflow.cn/v1
  api_key: ""
  model: deepseek-ai/DeepSeek-V4-Flash
  # Only 1536-dimensional vectors or supported 4096-dimensional vectors are stored.
  embedding_model: Qwen/Qwen3-VL-Embedding-8B
  timeout_seconds: 30

skills:
  dir: skills

artifacts:
  dir: data/artifacts

# Opt-in only. Each service needs a unique name and an explicit tool allowlist.
# token_env is an ENVIRONMENT VARIABLE NAME, never the actual token.
# Model-facing tools: mcp__tavily__tavily_search, mcp__tavily__tavily_extract.
external_mcps: []
# external_mcps:
#   - name: tavily
#     url: https://mcp.tavily.com/mcp/
#     token_env: TAVILY_API_KEY
#     tools: [tavily_search, tavily_extract]
#   - name: docs
#     url: http://127.0.0.1:8090/mcp
#     tools: [search]

# Backwards-compatible alternative; do not combine with external_mcps.
# Legacy model-facing names remain mcp_tavily_search and mcp_tavily_extract.
# external_mcp:
#   url: https://mcp.tavily.com/mcp/
#   token_env: TAVILY_API_KEY
#   tools: [tavily_search, tavily_extract]

# Optional custom child roles. Omission selects built-in researcher/reviewer.
# PresetAgents is case-sensitive. Allowed tools also have to exist on the parent.
# subagents:
#   default_agent: researcher
#   PresetAgents:
#     - name: researcher
#       description: Search memories and public references.
#       instructions: Verify original sources and report unresolved questions.
#       tools: [search_memories, get_messages, get_sessions, mcp__tavily__tavily_search, mcp__tavily__tavily_extract]
