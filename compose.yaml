services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${RECALLWEAVE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${RECALLWEAVE_DB_PASSWORD:-recallweave-local}
      POSTGRES_DB: ${RECALLWEAVE_DB_NAME:-recallweave}
    ports:
      - "127.0.0.1:${RECALLWEAVE_DB_PORT:-5434}:5432"
    volumes:
      - recallweave-postgres:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  recallweave-postgres:
